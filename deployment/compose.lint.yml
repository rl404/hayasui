services:
  hayasui-lint:
    container_name: hayasui-lint
    image: golangci/golangci-lint:v2.15.0
    working_dir: /hayasui
    command: make lint
    environment:
      - GOFLAGS=-mod=vendor
    volumes:
      - ../:/hayasui:ro
      - go-mod-cache:/go/pkg/mod
    profiles:
      - lint

volumes:
  go-mod-cache:
