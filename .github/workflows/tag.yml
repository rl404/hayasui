name: Tag

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.CR_PAT }}
